# Streaming SSNN SOFE pretraining base.
# Uses SMCM's event-native fixed-time/hybrid partitioning and renders IWEs.
_base_: "../_base/pretrain_streaming.yaml"

training:
  mode: "mcm_pretrain"
  batch_size: 1
  num_epochs: 30
  max_steps_per_epoch: 500
  optimizer: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  warmup_epochs: 0
  warmup_lr: 0.0
  use_amp: false
  grad_clip: 5.0
  streaming_step_policy: "chunk_backward"
  log_grad_norm: true
  log_grad_norm_interval: 50
  use_mosaic: false
  use_mixup: false
  mosaic_prob: 0.0
  mixup_prob: 0.0

data:
  dataset_config: "src/smcfnet/config/dsec/optical_flow_train_heldout.yaml"
  event_bins: 5
  event_window_ms: 50
  mapper_load_events: true
  mapper_load_images: false
  mapper_prefer_distorted: false
  mapper_rectified_events_resolution: "orig"
  mapper_load_tracks: false
  mapper_build_targets: false
  mapper_load_flow: true
  num_workers: 4

model:
  mcm:
    enabled: true
    mode: "snn"
    architecture: "sofe"
    estimator_representation: "streaming_events"
    output_representation: "iwe"
    input_representation: "streaming_events"
    prefetcher_type: "streaming"
    loss_type: "event_warping_supervised"
    warper_type: "sparse_event"
    partition_mode: "hybrid"
    step_time_us: null
    events_per_step_target: 15000
    step_dt_min_us: null
    step_dt_max_us: null
    max_steps_per_sample: null
    decay_tau_us: 10000.0
    flow_scaling: 4.0
    loss_scaling: true
    smooth_weight: 1.0
    loss_kwargs:
      smoothness_mode: "mean_l1"
    reset_on_sequence_change: true
    bptt_steps: 5
    sofe_architecture:
      family: "ssnn_net"
      step_encoding: "hist2"
      normalize_counts: false
      count_encoding: "raw"
      count_scale: 1.0
      base_channels: 24
      kernel_size: 5
      ssnn_multiply_factor: 10.0
      ssnn_hard_reset: false
      ssnn_spike_decay_mode: "decay"
      surrogate_function: "sigmoid"
      surrogate_alpha: 4.0
      detach_reset: true
      spiking_v_threshold: 1.0
      spiking_v_reset: 0.0
      readout_type: "single_scale"
      flow_activation: "softsign"
      flow_head_init: "small_normal"
      flow_head_init_std: 0.01
      ssnn_pred_kernel_size: 3

eval:
  eval_interval: 5
  save_interval: 5
  mon_eval:
    enabled: true
    split: "val"

log:
  output_dir: "./outputs/sofe/ssnn_net"
  experiment_name: "ssnn_net_streaming_base"
  log_interval: 5

wandb:
  use_wandb: true
  project_name: "smcfnet_ssnn_net"
  group: "ssnn_net_streaming"
  tags: ["ssnn_net", "streaming_events", "iwe", "rectified_orig"]
  log_every_n_steps: 10
  flush_every_n_steps: 50
  mode: "disabled"
