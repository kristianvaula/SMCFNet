[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smcfnet"
version = "0.1.0"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Default per-test timeout (seconds) to prevent hanging runs.
timeout = 180
timeout_method = "thread"
markers = [
	"cpu: marks tests that should be excluded in GPU-focused runs",
]
